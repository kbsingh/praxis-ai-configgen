[project]
name = "praxis-local-net-configgen"
version = "0.1.0"
description = "Discover local AI model servers and generate praxis-ai configuration"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
